# Servidor estatico do frontend, com proxy para o backend.
#
# Publicar apenas a porta 80 (HTTP) e suficiente: o proxy cuida de
# encaminhar /api para o container do backend, mantendo tudo na mesma
# origem e dispensando configuracao de CORS no navegador.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Backend. O timeout do proxy precisa ser MAIOR que o timeout de
    # extracao do backend (YTDLP_TIMEOUT_MS, padrao 120s), senao o nginx
    # cortaria a resposta antes do backend responder.
    location /api/ {
       proxy_pass https://download-aggregator.onrender.com;
    proxy_http_version 1.1;

    proxy_ssl_server_name on;
    proxy_ssl_name download-aggregator.onrender.com;

    proxy_set_header Host download-aggregator.onrender.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 10s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    proxy_buffering off;
    }

    location /health { 
        proxy_pass https://download-aggregator.onrender.com;
   
   proxy_ssl_server_name on;
    proxy_ssl_name download-aggregator.onrender.com;

    proxy_set_header Host download-aggregator.onrender.com;
}

    location / {
        try_files $uri $uri/ =404;
    }
}